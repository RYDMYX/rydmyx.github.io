  <!-- Fullscreen + orientation logic -->
  <script>
    const fsBtn = document.getElementById('fullscreenBtn');
    const exitBtn = document.getElementById('exitFullscreenBtn');

    function isMobilePortrait() {
      return window.innerWidth < window.innerHeight;
    }

    async function enterFullscreen() {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }

      if (screen.orientation?.lock) {
        try {
          await screen.orientation.lock('landscape');
        } catch {
          // silently ignore (iOS etc.)
        }
      }
    }

    async function exitFullscreen() {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      }
    }

    function updateButtons() {
      const isFS = !!document.fullscreenElement;

      // Show fullscreen button only on mobile portrait & not fullscreen
      fsBtn.hidden = isFS || !isMobilePortrait();

      // Show exit button only while fullscreen
      exitBtn.hidden = !isFS;
    }

    fsBtn.addEventListener('click', enterFullscreen);
    exitBtn.addEventListener('click', exitFullscreen);

    document.addEventListener('fullscreenchange', updateButtons);
    window.addEventListener('resize', updateButtons);

    updateButtons();
  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/tules/service-worker.js')
      .then(reg => console.log('SW registered', reg.scope))
      .catch(err => console.error('SW failed', err));
  });
}
</script>

<script>

const MIN_SPLASH_TIME = 1000;
const startTime = Date.now();

function isAndroidPWA() {
  return window.matchMedia('(display-mode: standalone)').matches
    && /Android/i.test(navigator.userAgent);
}

function hideSplashSmoothly() {
  const splash = document.getElementById("splash");

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
splash.classList.add("fade-out");
      splash.style.opacity = "0";
      setTimeout(()=> splash.remove(), 450);
    });
  });
}

window.addEventListener("load", () => {

  const splash = document.getElementById("splash");

  // If PWA → skip custom splash completely
  if (isAndroidPWA()) {
  splash.remove();
  return;
}

  const elapsed = Date.now() - startTime;
  const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);

  setTimeout(() => {
    hideSplashSmoothly();
  }, remaining);

});

</script>
